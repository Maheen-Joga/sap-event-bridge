[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-event-bridge"
version = "0.1.0"
description = "A pipeline for mock SAP business events on AWS: EventBridge, Lambda, DynamoDB, S3 and a dead-letter queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maheen Joga" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34", "moto[dynamodb,s3,sqs]>=5", "pyyaml>=6"]

[tool.setuptools]
packages = ["sapbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
